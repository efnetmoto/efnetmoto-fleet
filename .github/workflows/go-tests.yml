---
name: Go Tests

on:
  pull_request:
    paths:
      - 'services/url-shortener/**'

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          cache-dependency-path: services/url-shortener/go.sum

      - name: Download dependencies
        run: |
          cd services/url-shortener
          go mod download

      - name: Format check (gofmt)
        run: |
          cd services/url-shortener
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::gofmt found unformatted files:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: |
          cd services/url-shortener
          go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Staticcheck
        run: |
          cd services/url-shortener
          staticcheck ./...

      - name: Test
        run: |
          cd services/url-shortener
          go test -race ./...
