---
name: Go Tests

on:
  pull_request:
    paths:
      - 'services/url-shortener/**'

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: services/url-shortener/go.sum

      - name: Download dependencies
        run: |
          cd services/url-shortener
          go mod download

      - name: Format check (gofmt)
        run: |
          cd services/url-shortener
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::gofmt found unformatted files:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: |
          cd services/url-shortener
          go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Staticcheck
        run: |
          cd services/url-shortener
          staticcheck ./...

      - name: Test
        run: |
          cd services/url-shortener
          go test -race ./...
