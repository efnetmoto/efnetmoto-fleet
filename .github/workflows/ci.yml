---
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
            submodules: true
            fetch-depth: 0

      - name: Run yamllint
        uses: ansible-actions/yamllint-action@e4e6dfffffc1e419e4f414bb05c57e540413198c # pin: main @ 2026-07-25
        with:
          target: "."

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Force install Ansible Galaxy collections
        run: ansible-galaxy collection install -r ansible/requirements.yml --force

      - name: Run ansible-lint
        uses: ansible/ansible-lint@43b00b540e6cdfd773e3b74e0f8afebb49967847 # pin: main @ 2026-07-25
        with:
          requirements_file: ansible/requirements.yml

  ansible-syntax:
    name: Ansible Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: pip install ansible

      - name: Install Ansible Galaxy requirements
        run: ansible-galaxy install -r ansible/requirements.yml

      - name: Syntax check all playbooks
        run: |
          for playbook in deploy-*.yml; do
            echo "Checking $playbook..."
            ansible-playbook --syntax-check "$playbook"
          done

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # pin: master @ 2026-07-25
        with:
          scandir: '.'
          severity: warning

  hadolint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: services/*/Dockerfile
          recursive: true

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run markdownlint
        uses: articulate/actions-markdownlint@17b8abe7407cd17590c006ecc837c35e1ac3ed83 # v1.1.0
        with:
          config: .markdownlint.yml
          files: '**/*.md'
          ignore: node_modules

  tcl-lint:
    name: TCL Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          python3 -m venv venv
          venv/bin/pip install tclint==0.7.0

      - name: Run TCL Lint
        run: |
          source venv/bin/activate
          tclfmt --check .
          tclint .

  secrets-scan:
    name: Secrets Scan
    if: github.actor != 'dependabot[bot]'  # Actions secrets (incl. GITLEAKS_LICENSE) are withheld on Dependabot PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
