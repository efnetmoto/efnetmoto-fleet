# Minimal ngircd configuration for the integration tests: no SSL, no oper block.

[Global]
    # ngircd requires a dotted server name (a bare 'ircd' is rejected as
    # invalid). This is the advertised server name only; bots connect to the
    # docker-DNS host 'ircd', which is unrelated to this value.
    Name = ircd.local
    Info = EFNet Moto integration test ircd
    AdminInfo1 = EFNet Moto integration tests
    AdminInfo2 = https://github.com/efnetmoto/efnetmoto-fleet
    MotdPhrase = Welcome to the EFNet Moto integration test ircd
    Listen = 0.0.0.0
    Ports = 6667
    PidFile = /tmp/ngircd.pid
    # The container starts as root; ngircd drops to this user.
    ServerUID = ngircd
    ServerGID = ngircd

[Options]
    # Skip reverse-DNS and ident lookups, which only add connect delays here.
    DNS = no
    Ident = no
    OperCanUseMode = no
    # ngircd is built with PAM and would authenticate each client's USER field
    # against system accounts, rejecting the bots with "Bad password!".
    PAM = no

[Limits]
    # Every client connects from the same host: the three bots plus the driver.
    MaxConnections = 64
    MaxConnectionsIP = 32
    # ngircd defaults to 9-character nicks; EFnet allows longer ones.
    MaxNickLength = 32

[Channel]
    Name = #motorcycles
    Topic = EFNet Moto integration test
    Modes = n
