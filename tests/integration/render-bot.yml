---
# Render tasks for one bot (one iteration of render.yml's loop). The bot's host_vars
# are loaded namespaced and promoted to top level so the real templates can see them.
# set_fact also resets them on each pass, so one bot's values can't leak into the next,
# and the defaults cover vars that only some bots define (pisg_enabled, ...).
# Paths use repo_root because this file lives under tests/integration/.

- name: "Load {{ bot_slug }} host_vars (namespaced)"
  ansible.builtin.include_vars:
    file: "{{ repo_root }}/ansible/host_vars/localhost/{{ bot_slug }}.yml"
    name: bot_cfg

- name: "Promote per-bot scalar vars to top level with defaults ({{ bot_slug }})"
  ansible.builtin.set_fact:
    bot_nick: "{{ bot_cfg.bot_nick }}"
    bot_username: "{{ bot_cfg.bot_username }}"
    bot_realname: "{{ bot_cfg.bot_realname }}"
    bot_admin: "{{ bot_cfg.bot_admin }}"
    bot_owner: "{{ bot_cfg.bot_owner }}"
    bot_scripts: "{{ bot_cfg.bot_scripts }}"
    runtime_dirs: "{{ bot_cfg.runtime_dirs | default([]) }}"
    separate_log_dirs: "{{ bot_cfg.separate_log_dirs | default(false) }}"
    pisg_enabled: "{{ bot_cfg.pisg_enabled | default(false) }}"
    pisg_cron_schedule: "{{ bot_cfg.pisg_cron_schedule | default('@hourly') }}"
    pisg_channels: "{{ bot_cfg.pisg_channels | default([]) }}"
    extra_config: "{{ bot_cfg.extra_config | default('') }}"

# Promoted after the scalars because its values reference them
# (cron_schedule: "{{ pisg_cron_schedule }}").
- name: "Promote environment_variables ({{ bot_nick }})"
  ansible.builtin.set_fact:
    environment_variables: "{{ bot_cfg.environment_variables }}"

# Point the rendered .env at the api-stub; keys not listed keep their real values.
- name: "Apply integration provider URL overrides ({{ bot_nick }})"
  ansible.builtin.set_fact:
    environment_variables: >-
      {{ environment_variables | combine(integration_provider_url_overrides[bot_slug] | default({})) }}
  when: integration_provider_url_overrides is defined

- name: "Create runtime directories ({{ bot_nick }})"
  ansible.builtin.file:
    path: "{{ repo_root }}/{{ item }}"
    state: directory
    mode: "0775"
  loop: "{{ runtime_dirs }}"

- name: "Generate eggdrop.conf ({{ bot_nick }})"
  ansible.builtin.template:
    src: "{{ repo_root }}/templates/eggdrop.conf.j2"
    dest: "{{ repo_root }}/bots/{{ bot_nick }}/data/eggdrop.conf"
    mode: "0640"

- name: "Generate .env ({{ bot_nick }})"
  ansible.builtin.copy:
    content: |
      # Generated by Ansible - Do not edit manually
      # Source of truth: ansible/host_vars/localhost/{{ bot_nick | lower }}.yml

      {% for key, val in environment_variables.items() %}
      {{ key | upper }}={{ val }}
      {% endfor %}
      UID={{ ansible_user_uid }}
      GID={{ ansible_user_gid }}
    dest: "{{ repo_root }}/bots/{{ bot_nick }}/.env"
    mode: "0600"

# Inlined instead of including generate-pisg-footer.yml, whose template paths assume
# a repo-root playbook_dir.
- name: "Generate pisg.cfg ({{ bot_nick }})"
  ansible.builtin.template:
    src: "{{ repo_root }}/templates/pisg.cfg.j2"
    dest: "{{ repo_root }}/bots/{{ bot_nick }}/pisg-config/pisg.cfg"
    mode: "0644"
  when: pisg_enabled

- name: "Find year directories for pisg archive links ({{ bot_nick }})"
  ansible.builtin.find:
    paths: "{{ repo_root }}/bots/{{ bot_nick }}/html"
    file_type: directory
    patterns: "[0-9]{4}"
    use_regex: true
  register: integration_pisg_year_dirs
  when: pisg_enabled

- name: "Sort year directories ({{ bot_nick }})"
  ansible.builtin.set_fact:
    sorted_years: >-
      {{ integration_pisg_year_dirs.files | map(attribute='path') | map('basename')
      | sort | reverse | list }}
  when: pisg_enabled

- name: "Generate pisg archive-links fragment ({{ bot_nick }})"
  ansible.builtin.template:
    src: "{{ repo_root }}/templates/archive-links.html.j2"
    dest: "{{ repo_root }}/bots/{{ bot_nick }}/html/archive-links.html"
    mode: "0644"
  when: pisg_enabled

- name: "Generate pisg footer ({{ bot_nick }})"
  ansible.builtin.template:
    src: "{{ repo_root }}/templates/pisg-footer.txt.j2"
    dest: "{{ repo_root }}/bots/{{ bot_nick }}/pisg-config/footer.txt"
    mode: "0644"
  when: pisg_enabled
