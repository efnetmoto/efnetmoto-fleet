services:
  xerokewl:
    build:
      context: ../..
      dockerfile: services/eggdrop/Dockerfile
    container_name: xerokewl
    restart: unless-stopped

    # REQUIRED: Keep stdin open even if not attached
    # Without this, Eggdrop will give "END OF FILE ON TERMINAL" error
    stdin_open: true

    # DCC/Telnet port
    ports:
      - "${DCC_PORT}:2020"
      - "${DCC_PORTRANGE}:${DCC_PORTRANGE}"

    volumes:
      # Persistent data directory (REQUIRED)
      # Contains: config, userfile, chanfile
      - ./data:/eggdrop/data

      # Bot logs (operational logs - mco flags)
      - ./logs:/eggdrop/logs

      # Shared TCL scripts (from repo root)
      - ../../shared/tcl-scripts:/eggdrop/scripts-shared

      # Shared Python scripts (from repo root)
      - ../../shared/python-scripts:/eggdrop/scripts-python-shared

    environment:
      - TZ=${TZ}
      - EGGDROP_UID=${UID}
      - EGGDROP_GID=${GID}
      - WEATHERAPI_KEY=${WEATHERAPI_KEY}
      - APRSFI_KEY=${APRSFI_KEY}

    cap_drop:
      - ALL
    cap_add:
      - CHOWN       # entrypoint chown -R /eggdrop to runtime UID:GID before privilege drop
      - SETUID      # su-exec setuid() to drop from root to EGGDROP_UID
      - SETGID      # su-exec setgid() to drop from root to EGGDROP_GID

    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.10

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "test -f /eggdrop/data/pid.Xerokewl && test -d /proc/$(cat /eggdrop/data/pid.Xerokewl)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    networks:
      - xerokewl-net

networks:
  xerokewl-net:
    driver: bridge
