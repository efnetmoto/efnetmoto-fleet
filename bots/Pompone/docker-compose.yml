services:
  pompone:
    build:
      context: ../..
      dockerfile: services/eggdrop/Dockerfile
    container_name: pompone
    restart: unless-stopped

    # REQUIRED: Keep stdin open even if not attached
    # Without this, Eggdrop will give "END OF FILE ON TERMINAL" error
    stdin_open: true

    # DCC/Telnet port
    ports:
      - "${DCC_PORT}:2020"
      - "${DCC_PORTRANGE}:${DCC_PORTRANGE}"

    volumes:
      # Persistent data directory (REQUIRED)
      # Contains: config, userfile, chanfile
      - ./data:/eggdrop/data

      # Bot logs (operational logs - mco flags)
      - ./logs/bot:/eggdrop/logs/bot

      # Channel logs (for pisg consumption)
      - ./logs/channels:/eggdrop/logs/channels

      # Shared TCL scripts (from repo root)
      - ../../shared/tcl-scripts:/eggdrop/scripts-shared

      # Shared Python scripts (from repo root)
      - ../../shared/python-scripts:/eggdrop/scripts-python-shared

    environment:
      - TZ=${TZ}
      - EGGDROP_UID=${UID}
      - EGGDROP_GID=${GID}
      # Search bot (searchbot.py) reads these via os.environ at pysource load
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - SHORTENER_API_URL=${SHORTENER_API_URL}
      - SHORTENER_API_KEY=${SHORTENER_API_KEY}
      # Anti-troll join-gate (joingate.tcl reads these at source time)
      - JOINGATE_CHANNEL=${JOINGATE_CHANNEL}
      - JOINGATE_RBL_PROVIDERS=${JOINGATE_RBL_PROVIDERS}
      - JOINGATE_SOAK_CLEAN_SECONDS=${JOINGATE_SOAK_CLEAN_SECONDS}
      - JOINGATE_SOAK_RBL_HIT_SECONDS=${JOINGATE_SOAK_RBL_HIT_SECONDS}
      - JOINGATE_OP_RESPONSE_WINDOW_SECONDS=${JOINGATE_OP_RESPONSE_WINDOW_SECONDS}
      - JOINGATE_RBL_LOOKUP_TIMEOUT_SECONDS=${JOINGATE_RBL_LOOKUP_TIMEOUT_SECONDS}
      - JOINGATE_ENABLED=${JOINGATE_ENABLED}

    cap_drop:
      - ALL
    cap_add:
      - CHOWN       # entrypoint chown -R /eggdrop to runtime UID:GID before privilege drop
      - SETUID      # su-exec setuid() to drop from root to EGGDROP_UID
      - SETGID      # su-exec setgid() to drop from root to EGGDROP_GID

    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.10

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "test -f /eggdrop/data/pid.Pompone && test -d /proc/$(cat /eggdrop/data/pid.Pompone)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    networks:
      - pompone-net

  pisg:
    build:
      context: ../../services/pisg
      dockerfile: Dockerfile
    container_name: pompone-pisg
    restart: unless-stopped

    volumes:
      # Channel logs (read-only input)
      - ./logs/channels:/logs:ro

      # PISG cache for faster processing
      - ./pisg-cache:/cache

      # Generated HTML output
      - ./html:/output

      # PISG configuration files
      - ./pisg-config:/config:ro

    user: "${UID}:${GID}"

    cap_drop:
      - ALL

    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "sh", "-c", "find /output/index.html -mmin -120 2>/dev/null | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 65m

    environment:
      - CRON_SCHEDULE=${CRON_SCHEDULE}

    networks:
      - pompone-net

    depends_on:
      - pompone

  nginx:
    image: nginx:alpine3.23-slim
    container_name: pompone-nginx
    restart: unless-stopped

    # HTTP port for stats (configured via .env)
    ports:
      - "${STATS_PORT}:80"

    volumes:
      # Serve the HTML stats generated by pisg
      - ./html:/usr/share/nginx/html:ro

    cap_drop:
      - ALL
    cap_add:
      - CHOWN           # entrypoint chowns /var/cache/nginx/* before privilege drop
      - NET_BIND_SERVICE  # master process binds to container port 80 (< 1024)
      - SETUID            # master forks workers and setuid() to nginx user
      - SETGID            # master forks workers and setgid() to nginx group

    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.10

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "printf 'GET / HTTP/1.0\\r\\n\\r\\n' | nc -w3 127.0.0.1 80 | head -1 | grep -q '^HTTP'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - pompone-net

    depends_on:
      - pisg

  url-shortener:
    build:
      context: ../../services/url-shortener
      dockerfile: Dockerfile
    container_name: pompone-url-shortener
    restart: unless-stopped

    # Run as the host user (like pisg) so the bind-mounted SQLite DB is
    # writable without root or a chown entrypoint.
    user: "${UID}:${GID}"

    volumes:
      # Persistent SQLite database (bind-mounted for backup coverage)
      - ./url-shortener-data:/data

    environment:
      - PORT=8080
      - DATABASE_PATH=/data/shortener.db
      - PUBLIC_BASE_URL=https://go.efnetmoto.com
      - API_KEY=${SHORTENER_API_KEY}

    cap_drop:
      - ALL

    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.10

    security_opt:
      - no-new-privileges:true

    # No ports published to the host — the create API is reachable only
    # on pompone-net (from Pompone). The public redirect endpoint is
    # exposed via a reverse proxy configured in docker-compose.override.yml
    # (see docker-compose.override.yml.example, Example 5).
    networks:
      - pompone-net

networks:
  pompone-net:
    driver: bridge
